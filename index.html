<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sano</title>
<meta name="description" content="Sano, organizador do dia">
<link rel="icon" type="image/png" href="favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0eeea;--card:#fbf9f6;--ink:#1d1b19;--mut:#8a857e;--line:#e7e2db;--acc:#f08a24;--sh:0 1px 2px rgba(60,40,10,.04),0 10px 28px rgba(60,40,10,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--card:#242220;--ink:#f1ede7;--mut:#9a948b;--line:#37332f;--sh:0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#1a1917;--card:#242220;--ink:#f1ede7;--mut:#9a948b;--line:#37332f;--sh:0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}main{min-width:0}
aside{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:800;font-size:17px;padding:2px 12px 20px;display:flex;gap:10px;align-items:center}
.brand .lg{width:38px;height:30px;flex:none}.brand span{font-size:21px;letter-spacing:-.04em;line-height:1}.brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:0;color:var(--mut);margin-top:3px}
.nb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:13px;color:var(--mut);font-weight:600;width:100%}
.nb:hover{color:var(--ink)}.nb.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}.nb.on svg{stroke:var(--acc)}
.nb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{padding:30px 34px 96px;max-width:1320px;width:100%}
h1{font-size:27px;margin:0 0 2px;letter-spacing:-.02em;font-weight:800}h2{font-size:15px;margin:0 0 12px;font-weight:700}h3{margin:0 0 12px}
.sub,.mut{color:var(--mut)}.sub{margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--sh)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s8{grid-column:span 8}.s9{grid-column:span 9}.s10{grid-column:span 10}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.sp{justify-content:space-between}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--acc);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.06)}.btn.g{background:transparent;color:var(--mut);border:1px solid var(--line)}.btn.g:hover{color:var(--ink)}
.ib{all:unset;cursor:pointer;color:var(--mut);padding:2px 6px;border-radius:8px}.ib:hover{color:var(--ink);background:var(--bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%}
input[type=checkbox]{width:auto;accent-color:var(--acc)}input[type=color]{padding:2px;height:38px;width:60px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:12px;color:var(--mut)}label.f>*{margin-top:5px;font-weight:400}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:240px;display:flex;flex-direction:column;gap:6px}
.col.today{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}.col.over{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.ch{display:flex;justify-content:space-between;align-items:baseline}.ch b{font-weight:700}.ch span{font-size:20px;font-weight:800}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.it{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:10px;font-size:13px;cursor:pointer}.it:hover{background:var(--bg)}
.it.once{border:1px dashed var(--line);cursor:grab}.dn span{text-decoration:line-through;color:var(--mut)}.late span{color:#c4623a}
.it span{flex:1;min-width:0;word-break:break-word}.tag{font-size:10px;color:var(--mut)}
.add{all:unset;cursor:pointer;color:var(--mut);font-size:12px;padding:6px 8px;margin-top:auto;border-radius:10px}.add:hover{color:var(--acc)}
.chip{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;color:var(--mut)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px}.stat b{display:block;font-size:20px;font-weight:800}.stat small{color:var(--mut)}
.cells{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.cell{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut)}
.cell.on{color:#fff;border-color:transparent}.cell.off{opacity:.4}.cell.tdy{outline:2px solid var(--ink);outline-offset:1px}.cell:disabled{opacity:.25;cursor:default}
.ov{position:fixed;inset:0;background:rgba(20,15,10,.42);display:grid;place-items:center;z-index:40;padding:16px}
.md{background:var(--card);border-radius:22px;padding:24px;width:min(440px,100%);max-height:90vh;overflow:auto;box-shadow:var(--sh)}
.wds{display:flex;gap:8px;flex-wrap:wrap}.wds label{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--ink)}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw.on{box-shadow:0 0 0 2px var(--ink)}
.hh{display:flex;gap:14px;align-items:center}.em{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px}
textarea{resize:vertical}
.sv{margin-top:auto;font-size:12px;color:var(--mut);padding:8px 12px}.sv.err{color:#c4623a;font-weight:700}
.emo{all:unset;cursor:pointer;font-size:28px;padding:8px 11px;border-radius:14px;border:1px solid var(--line)}.emo.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.ned{overflow-wrap:anywhere;word-break:break-word;min-height:360px;padding:10px 2px;outline:none;line-height:1.7;font-size:15px}.ned:empty::before{content:'Comece a escrever…';color:var(--mut)}.ned img{max-width:100%;border-radius:12px;margin:6px 0;cursor:zoom-in}.ned h2{font-size:20px;margin:14px 0 6px}.ned blockquote{margin:8px 0;padding:4px 14px;border-left:3px solid var(--acc);color:var(--mut)}.ned ul,.ned ol{padding-left:22px}.tb{display:flex;gap:2px;flex-wrap:wrap;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin:8px 0}
.sheetw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}table.sh{border-collapse:collapse;font-size:13px;min-width:1180px;width:100%}.sh td,.sh th{border:1px solid var(--line);padding:5px 8px;white-space:nowrap}.sh td.n{text-align:right;font-variant-numeric:tabular-nums;cursor:cell}.sh .nm{position:sticky;left:0;background:var(--card);z-index:1;min-width:210px}.sh tr.hd td{background:var(--bg);font-weight:800;letter-spacing:.06em;color:var(--mut);font-size:12px}.sh td.ti{background:color-mix(in srgb,#7fa15a 8%,var(--card))}.sh td.to{background:color-mix(in srgb,var(--acc) 7%,var(--card))}.sh td.pos{background:color-mix(in srgb,#7fa15a 22%,var(--card))}.sh td.neg{background:color-mix(in srgb,#c4623a 20%,var(--card))}.sh tr.sm td{font-weight:700}.sh td.er{color:#c4623a;font-weight:700}.sh th.mh{background:var(--bg);cursor:pointer}.sh th.mh.pos{box-shadow:inset 0 -3px 0 #7fa15a}.sh th.mh.neg{box-shadow:inset 0 -3px 0 #c4623a}.sh th.mh.cur{color:var(--acc)}.sh input{width:100%;text-align:right;padding:2px 4px;border-radius:6px;min-width:80px}.sh .ltr th{font-size:10px;color:var(--mut);font-weight:500;text-align:center;padding:2px;background:var(--card)}.rn{color:var(--mut);font-size:10px;margin-right:6px}
/* planilha — acabamento */
.sheetw{border-radius:18px;box-shadow:var(--sh);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
table.sh{border-collapse:separate;border-spacing:0;font-size:13px}
.sh td,.sh th{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 12px;height:36px}
.sh tr>:last-child{border-right:0}.sh tr:last-child>*{border-bottom:0}
.sh .nm{min-width:220px;font-weight:600;box-shadow:1px 0 0 var(--line)}
.sh .rn{display:inline-block;min-width:18px;color:color-mix(in srgb,var(--mut) 70%,transparent);font-weight:500}
.sh .ltr th{height:22px;padding:0;font-size:10px;font-weight:600;color:color-mix(in srgb,var(--mut) 75%,transparent);background:var(--bg)}
.sh th.mh{height:42px;padding:0 12px;text-align:right;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--mut);background:var(--bg);transition:color .15s,background .15s}
.sh th.mh:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 4%,var(--bg))}
.sh th.mh.cur{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--bg))}
.sh th.mh.pos{box-shadow:inset 0 -3px 0 #8db368}.sh th.mh.neg{box-shadow:inset 0 -3px 0 #d0805f}
.sh td.n{min-width:104px;width:104px;color:var(--ink);transition:background-color .12s}
.sh td.ti{background:color-mix(in srgb,#7fa15a 5%,var(--card))}
.sh td.to{background:color-mix(in srgb,var(--acc) 4%,var(--card))}
.sh td.n[data-r]:hover{background-color:color-mix(in srgb,var(--acc) 10%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
.sh tr:hover td.nm{color:var(--acc)}
.sh td.z{color:color-mix(in srgb,var(--mut) 60%,transparent);font-weight:500}.sh td.edt{background-image:linear-gradient(225deg,var(--acc) 0 7px,transparent 7px)}
.sh td.pos{background:color-mix(in srgb,#7fa15a 13%,var(--card));color:#4d7a2a}
.sh td.neg{background:color-mix(in srgb,#c4623a 12%,var(--card));color:#b0532e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sh td.pos{color:#a9cf86}:root:not([data-theme="light"]) .sh td.neg{color:#eb9a78}}
.sh tr.hd td{height:34px;background:var(--bg);font-size:11px;font-weight:800;letter-spacing:.08em}
.sh tr.hd td.nm{color:var(--ink)}
.sh tr.hd-in td.nm{box-shadow:inset 4px 0 0 #7fa15a}.sh tr.hd-out td.nm{box-shadow:inset 4px 0 0 var(--acc)}.sh tr.hd-sum td.nm{box-shadow:inset 4px 0 0 var(--ink)}
.sh tr.hd .ib{font-size:11px;letter-spacing:0;font-weight:600;margin-left:6px;opacity:.7}.sh tr.hd .ib:hover{opacity:1;color:var(--acc)}
.sh td.nm .ib{opacity:0;transition:opacity .15s;font-size:12px}.sh tr:hover td.nm .ib,.sh td.nm .ib:focus-visible{opacity:1}
.sh tr.sm td{font-weight:700;background:var(--card)}
.sh tr.sob td{height:44px;font-size:14px;font-weight:800;border-top:2px solid var(--line)}
.sh td.ing{padding:0;background:var(--card)!important;background-image:none!important;box-shadow:inset 0 0 0 2px var(--acc)!important;position:relative;z-index:2}
.sh td.ing input{all:unset;box-sizing:border-box;display:block;width:100%;min-width:0;height:34px;padding:0 10px;text-align:right;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);caret-color:var(--acc)}
.sh input[data-lim]{text-align:right;padding:5px 9px;border-radius:9px;min-width:0;font-variant-numeric:tabular-nums}
.shleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 4px 0}.shleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* abertura e boas-vindas */
.welc h1{font-size:30px}
.spl{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;cursor:default;transition:opacity .5s ease,visibility .5s}
.spl.out{opacity:0;visibility:hidden}
.spl-in{display:flex;flex-direction:column;align-items:center;text-align:center;width:min(420px,100%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.spl-sun{width:150px;height:84px;overflow:visible}
.spl-sun .sun{transform:translateY(46px);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) .1s forwards;transition:fill .4s}
.spl-sun .hz{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .8s ease forwards}
.spl-w{font-size:clamp(64px,13vw,104px);font-weight:800;letter-spacing:-.06em;line-height:.95;margin-top:10px;display:flex}
.spl-w span{display:inline-block;opacity:0;transform:translateY(.35em);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.45s + var(--i)*.08s)}
.spl-s{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-top:14px;opacity:0;animation:fade .6s ease .95s forwards}
.spl-t{color:var(--mut);margin-top:6px;font-size:15px;opacity:0;animation:fade .6s ease 1.15s forwards}
.spl-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mut);opacity:0;animation:fade .5s ease 1.6s forwards}
.spl.ask .spl-in{transform:translateY(-6vh)}
.spl.ask .spl-skip{display:none}
.onb{width:100%;margin-top:34px;opacity:0;transform:translateY(10px);transition:opacity .45s ease .15s,transform .45s ease .15s;text-align:left}
.spl.ask .onb{opacity:1;transform:none}
.onb h3{font-size:20px;letter-spacing:-.01em;margin:0 0 4px}.onb p{color:var(--mut);margin:0 0 16px}
.onb input{font-size:17px;padding:13px 15px;border-radius:14px;background:var(--card)}
.onb .opts{display:flex;flex-direction:column;gap:8px}
.onb .opt{all:unset;box-sizing:border-box;cursor:pointer;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:600;display:flex;justify-content:space-between}
.onb .opt.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.onb .opt small{color:var(--mut);font-weight:500}
.onb .sws{display:flex;gap:12px;flex-wrap:wrap}.onb .sw{width:40px;height:40px;padding:0;cursor:pointer}.onb .dot{display:block}
.onb .nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.onb .dots{display:flex;gap:7px}
.onb .btn{padding:12px 22px;font-size:14px}
@keyframes rise{to{transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes up{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.spl *,.spl{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

.nbar{margin-bottom:6px;gap:8px}.ncols{display:inline-flex;gap:5px;margin-right:6px}.ncol{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}.ncol.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.ntypes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ntype{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg);transition:border-color .15s}.ntype:hover,.ntype:focus-visible{border-color:var(--acc)}.ntype span{font-size:22px;margin-bottom:4px}.ntype small{color:var(--mut)}
ul.chk{list-style:none;padding-left:2px!important}ul.chk>li{position:relative;padding-left:28px;margin:3px 0}ul.chk>li::before{content:'';position:absolute;left:2px;top:.3em;width:15px;height:15px;border:2px solid var(--mut);border-radius:5px;cursor:pointer;box-sizing:border-box}ul.chk>li.ok{text-decoration:line-through;color:var(--mut)}ul.chk>li.ok::before{background:var(--acc);border-color:var(--acc)}ul.chk>li.ok::after{content:'';position:absolute;left:7.5px;top:calc(.3em + 3px);width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.nwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:2px;grid-auto-flow:dense;column-gap:14px;row-gap:0;margin-top:16px;align-items:start}
.ntile{margin-bottom:14px;align-self:start;position:relative;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.ntile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}.ntile:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ntile.wd{grid-column:span 2}
.nth{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.nth b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nth small{color:var(--mut);font-size:11px;flex:none}
.ntb{max-height:440px;overflow:hidden;font-size:13px;line-height:1.55;color:color-mix(in srgb,var(--ink) 85%,transparent);pointer-events:none;overflow-wrap:anywhere}.ntb.cut{-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}.ntb:empty{display:none}
.ntb img{display:block;max-width:100%!important;height:auto!important;border-radius:10px;margin:6px 0}.ntb h1,.ntb h2,.ntb h3{font-size:14px;margin:4px 0}.ntb p{margin:0 0 6px}.ntb ul,.ntb ol{padding-left:18px;margin:4px 0}.ntb blockquote{margin:4px 0;padding-left:10px;border-left:3px solid var(--acc)}
@media (max-width:560px){.nwall{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ===== Personagens ===== */
.cimg{display:block;width:100%;height:100%;object-fit:cover}
.cph{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,hsl(var(--h) 60% 86%),transparent 60%),linear-gradient(150deg,hsl(var(--h) 42% 76%),hsl(calc(var(--h) + 35) 40% 60%));color:hsl(var(--h) 35% 28%);position:relative;overflow:hidden}
.cph::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.12) 14px 15px)}
.cph span{position:relative;z-index:1;font-weight:800;font-size:clamp(22px,4vw,46px);letter-spacing:-.03em;opacity:.85}
.cimg.sm,.cph.sm{width:44px;height:44px;border-radius:12px;flex:none}.cph.sm span{font-size:15px}
.cimg.xs,.cph.xs{width:26px;height:26px;border-radius:50%;flex:none}.cph.xs span{font-size:10px}.cph.xs::after,.cph.sm::after{display:none}
.cimg.qk,.cph.qk{width:64px;height:64px;border-radius:18px;flex:none}.cph.qk span{font-size:22px}
.cbar{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.cfilt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.csel{width:auto;padding:7px 10px;border-radius:11px;font-size:13px;background:var(--card)}
.ctog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer}
.cview{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-left:auto;background:var(--card)}
.cview button{all:unset;cursor:pointer;padding:7px 9px;color:var(--mut);display:grid}.cview button.on{background:var(--ink);color:var(--bg)}
.cview svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}

/* ===== Histórias ===== */
.crumb{display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap}.crumb i{font-style:normal;color:var(--mut);opacity:.6}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:6px}
.sfold{position:relative;cursor:pointer;padding-top:14px;transition:transform .18s}.sfold:hover{transform:translateY(-3px)}
.sftab{position:absolute;top:0;left:18px;width:42%;height:22px;border-radius:12px 12px 0 0;background:hsl(var(--h) 45% 72%)}
.sfold>.sfcov,.sfold>.sfb{position:relative}
.sfcov{height:150px;border-radius:0 18px 0 0;overflow:hidden;border:1px solid var(--line);border-bottom:0;background:hsl(var(--h) 45% 80%)}.sfcov .cimg,.sfcov .cph{width:100%;height:100%}
.sfb{background:var(--card);border:1px solid var(--line);border-top:4px solid hsl(var(--h) 45% 62%);border-radius:0 0 18px 18px;padding:14px 16px;box-shadow:var(--sh)}
.sfb h3{margin:0;font-size:17px;letter-spacing:-.01em}.sfb p{margin:4px 0 0;font-size:13px;color:color-mix(in srgb,var(--ink) 75%,transparent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sfm{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11.5px;color:var(--mut)}
.sfold:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:18px}
.shero .chpor .big{aspect-ratio:3/4}.sicon{font-size:20px}
.slore{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
.slnav{display:flex;flex-direction:column;gap:2px;font-size:13px;align-self:start;position:sticky;top:70px}
.slnav b{font-size:11px;color:var(--mut);margin:12px 0 4px}.slnav a{cursor:pointer;padding:6px 10px;border-radius:9px;color:var(--ink)}.slnav a:hover{background:var(--card)}.slnav a.on{background:var(--card);box-shadow:inset 3px 0 0 var(--acc)}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.sccard{cursor:pointer;display:flex;flex-direction:column;gap:8px}
.scpg{background:#fffdf8;color:#1d1b19;aspect-ratio:8.5/11;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px rgba(60,40,10,.1);padding:22% 14% 12%;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:'Courier Prime','Courier New',monospace;transition:transform .18s}
.sccard:hover .scpg{transform:translateY(-3px) rotate(-.4deg)}.scpg b{text-transform:uppercase;font-size:14px}.scpg small{font-size:11px;margin-top:6px}.scpg p{margin-top:auto;font-size:10px;opacity:.55;text-transform:uppercase}.scpg{padding-top:38%}.scpg .scpa{margin-top:2px;font-size:12px;font-weight:700}.scpg .scpd{margin-top:14px;opacity:.6;font-size:10px}.scpg .scpc{align-self:flex-start;text-align:left;text-transform:none;font-size:9px;line-height:1.3}
/* editor de roteiro */
.sctop{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sctitle{font-size:20px;font-weight:800;border:0;background:transparent;padding:4px 2px;width:auto;min-width:200px}
.sctb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.sctb #sct{min-width:210px;font-weight:600}
.scst{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.scbody{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
.scnav{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;display:flex;flex-direction:column;gap:1px;font-size:12.5px;padding-right:4px}
.scnav b{font-size:11px;color:var(--mut);margin:4px 0 6px}
.scns,.scna,.scnc{cursor:pointer;padding:5px 8px;border-radius:8px;color:var(--ink);text-decoration:none;display:flex;gap:7px;align-items:baseline;line-height:1.3}
.scns{box-shadow:inset 3px 0 0 var(--sc,transparent);text-transform:uppercase;font-size:11.5px}.scns i{display:none}
.scns:hover,.scnc:hover{background:var(--card)}.scns.on{background:var(--card);box-shadow:inset 3px 0 0 var(--acc),var(--sh)}
.scna{font-weight:800;font-size:11px;letter-spacing:.06em;color:var(--acc);margin-top:8px}
.scnc{justify-content:space-between}.scnc small{color:var(--mut)}
.scwrap{overflow-x:auto;padding-bottom:40px}
.scpaper{--pw:60ch;font-family:'Courier Prime','Courier New',Courier,monospace;font-size:15px;line-height:1.25;color:#1d1b19;background:#fffdf8;width:calc(var(--pw) + 150px);margin:0 auto;padding:64px 50px 120px 100px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 16px 40px rgba(60,40,10,.12);min-height:70vh;position:relative}
.sb{outline:none;width:var(--pw);white-space:pre-wrap;overflow-wrap:break-word;position:relative;padding:0 2px;border-radius:3px;min-height:1.25em}
.sb:focus{background:rgba(240,138,36,.07)}
.sb:empty::before{content:attr(data-ph);color:#b8b0a4;pointer-events:none}
.t-scene{margin-top:2.5em;text-transform:uppercase;font-weight:700}.sb.t-scene:first-child{margin-top:0}

.t-action{margin-top:1.25em}
.t-char{margin-top:1.25em;margin-left:22ch;width:auto;max-width:38ch;text-transform:uppercase}
.t-paren{margin-left:15ch;width:auto;max-width:25ch}
.t-dial{margin-left:10ch;width:35ch}
.t-trans{margin-top:1.25em;text-align:right;text-transform:uppercase}
.t-shot{margin-top:1.25em;text-transform:uppercase}
.t-act{margin-top:2.5em;text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#b06414;border-top:1px dashed #e3c9a8;border-bottom:1px dashed #e3c9a8;padding:4px 0}
.t-note{margin-top:1em;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;background:#fff4d6;border-left:3px solid #f2c94c;padding:6px 10px;color:#6b5a2a}
.t-note:empty::before{content:'Nota (não aparece na impressão)'}
.scpb{position:relative;height:0;margin:22px -50px 22px -100px;border-top:1px dashed #d9cfc2;user-select:none}
.scpb span{position:absolute;right:50px;top:10px;font-size:12px;color:#9b9286}
.scac{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(30,20,5,.18);padding:6px;display:flex;flex-direction:column;min-width:240px;max-width:320px}.scac[hidden]{display:none}.scac.in{animation:scacin .16s cubic-bezier(.2,.8,.2,1)}@keyframes scacin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.scach{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:4px 10px 6px}
.scac button{all:unset;cursor:pointer;padding:7px 10px;border-radius:9px;font-size:13.5px;text-transform:uppercase;font-family:'Courier Prime','Courier New',monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scac button b{color:var(--ink);font-weight:700}.scac button.on,.scac button:hover{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--ink)}
.scacf{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut);padding:6px 10px 2px;border-top:1px solid var(--line);margin-top:4px}.scacf kbd{font-family:inherit;font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.scact{grid-column:1/-1;font-weight:800;color:var(--acc);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px dashed var(--line);padding:10px 0 4px}
.scard{background:#fffdf8;color:#1d1b19;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px rgba(60,40,10,.08);border-top:5px solid var(--sc,#e7e2db);display:flex;flex-direction:column;gap:6px;cursor:grab;transition:transform .15s}
.scard b{font-family:'Courier Prime','Courier New',monospace;text-transform:uppercase;font-size:12.5px}
.scard textarea{background:transparent;border:1px dashed transparent;font-size:13px;color:#1d1b19;padding:4px}.scard textarea:hover,.scard textarea:focus{border-color:#e3d9cc}
.scard small{color:#8a857e}.scard .ib{align-self:flex-start;font-size:12px;color:#8a857e}
.scard.drag{opacity:.4}.scard.over{transform:translateX(8px);box-shadow:-4px 0 0 var(--acc),0 8px 20px rgba(60,40,10,.08)}
.sccol{display:inline-flex;gap:3px}.sccol button{all:unset;cursor:pointer;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px #d9cfc2}.sccol button.on{box-shadow:0 0 0 2px #1d1b19}
.scinfo{max-width:620px;margin:0 auto}
.sctp{background:#fffdf8;color:#1d1b19;aspect-ratio:8.5/11;border-radius:4px;box-shadow:0 16px 40px rgba(60,40,10,.12);padding:30% 12% 8%;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Courier Prime','Courier New',monospace;text-align:center}
.sctp input,.sctp textarea{font-family:inherit;text-align:center;background:transparent;border:1px dashed transparent;color:#1d1b19;max-width:420px}.sctp input:hover,.sctp textarea:hover,.sctp input:focus,.sctp textarea:focus{border-color:#e3d9cc}
.sctp input:first-child{font-size:22px;font-weight:700;text-transform:uppercase}.sctp textarea{margin-top:auto;text-align:left;align-self:flex-start;font-size:13px}.sctp span{font-size:14px}
#scprint{display:none}
@media print{body.printing>*:not(#scprint){display:none!important}body.printing{background:#fff}body.printing #scprint{display:block;color:#000;font-family:'Courier Prime','Courier New',monospace;font-size:12pt;line-height:1.2}
 @page{size:letter;margin:1in 1in 1in 1.5in}
 #scprint .prt-title{height:8.5in;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;break-after:page;position:relative}#scprint .prt-title h1{font-size:14pt;margin:0 0 1.5em}#scprint .prt-title p{margin:.2em}#scprint .prt-title .ct{position:absolute;left:0;bottom:0;text-align:left}
 #scprint .sb{width:6in;background:none}#scprint .t-char{margin-left:2.2in;width:auto}#scprint .t-paren{margin-left:1.5in;width:2.5in}#scprint .t-dial{margin-left:1in;width:3.5in}#scprint .t-act{color:#000;border-color:#000}
 #scprint .t-scene[data-n]::after{left:-.6in;color:#000}#scprint .prt-br{break-after:page;height:0}#scprint .t-scene,#scprint .t-char{break-after:avoid}}
/* ===== Ateliê ===== */
.afstrip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin-top:4px}
.aft{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:168px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.aft:hover{transform:translateY(-2px)}.aft.on{border-color:hsl(var(--h) 50% 55%);box-shadow:0 0 0 3px color-mix(in srgb,hsl(var(--h) 50% 55%) 25%,transparent),var(--sh)}.aft:focus-visible{outline:2px solid var(--acc)}
.afth{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:84px;border-radius:12px;overflow:hidden;background:hsl(var(--h) 40% 86%);margin-bottom:6px}
.afth img{width:100%;height:100%;object-fit:cover;display:block}.afth img:first-child{grid-row:span 2}.afth img:only-child{grid-column:span 2}.afth i{grid-column:span 2;grid-row:span 2}
.aft b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aft small{color:var(--mut);font-size:11.5px}
.abar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.abar .csh{font-size:20px;font-weight:800;flex:0 1 auto}
.abz{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-left:auto}.abz button{all:unset;cursor:pointer;padding:6px 11px;font-weight:700}.abz span{font-size:12px;min-width:40px;text-align:center}
.afocl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.afocl span{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mut)}
.abw{position:relative;height:calc(100vh - 230px);min-height:420px;overflow:auto;border:0;border-radius:0;background:transparent;box-shadow:none;margin:0 -8px 8px;padding:0 8px}
.abw.drop{outline:3px dashed var(--acc);outline-offset:-8px}
.ab{position:relative;transform-origin:0 0}
.ab.grid{background-image:radial-gradient(circle,color-mix(in srgb,var(--ink) 16%,transparent) 1px,transparent 1.4px);background-size:20px 20px}
.ap{position:absolute;border-radius:6px;box-shadow:none;background:transparent;cursor:grab;touch-action:none;user-select:none}
.ap img{width:100%;height:100%;object-fit:contain;border-radius:6px;display:block;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(40,25,5,.14))}
.ap.sel{outline:2px solid var(--acc);outline-offset:2px;z-index:1000!important}
.ab.dragging .ap{outline:0}.ap:hover{outline:1px dashed color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}.ab.dragging .ap.sel{outline:2px solid var(--acc);outline-offset:2px;cursor:grabbing;opacity:.92}
.aph{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--acc);cursor:nwse-resize;opacity:0}
.ap:hover .aph,.ap.sel .aph{opacity:1}
.apb{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .15s}.ap:hover .apb,.ap.sel .apb{opacity:1}
.apb button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--card) 92%,transparent);display:grid;place-items:center;font-size:13px;box-shadow:var(--sh)}
.apt{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);font-size:11px;font-weight:700;background:color-mix(in srgb,var(--card) 90%,transparent);padding:2px 8px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}.ap:hover .apt{opacity:1}
.agx,.agy{position:absolute;display:none;pointer-events:none;z-index:2000}.agx{top:0;bottom:0;width:0;border-left:1.5px solid #e2558b}.agy{left:0;right:0;height:0;border-top:1.5px solid #e2558b}
.abempty{position:absolute;inset:40px;display:grid;place-items:center;color:var(--mut);border:2px dashed var(--line);border-radius:20px}
.archl{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}.archl label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
@media (max-width:900px){.scbody,.slore{grid-template-columns:1fr}.scnav,.slnav{position:static;max-height:220px}.scpaper{padding:40px 16px 80px 40px}.t-scene[data-n]::after{left:-32px}}
/* planilha v2 */
.sheet2{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:8px 8px 12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
table.sh2{border-collapse:separate;border-spacing:0;width:100%;min-width:1140px;font-size:13.5px;font-variant-numeric:tabular-nums}
.sh2 th,.sh2 td{padding:0 10px;height:40px;white-space:nowrap;border:0;text-align:right}
.sh2 .nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:200px;padding-left:16px}
.sh2 td.n{min-width:94px}
.sh2 thead th{height:56px;font-weight:700;color:var(--mut);cursor:pointer;vertical-align:middle;border-bottom:1px solid var(--line)}
.sh2 thead th:hover .mn{color:var(--ink)}
.sh2 .mn{display:block;text-transform:capitalize;font-size:13px;transition:color .15s}
.sh2 .mk{display:flex;gap:4px;justify-content:flex-end;align-items:center;height:12px;margin-top:3px;font-size:11px}
.sh2 thead th.cur .mn{color:var(--acc)}.sh2 thead th.cur{box-shadow:inset 0 -3px 0 var(--acc)}
.sh2 th.yr{cursor:default}
.sh2 i.up,.shleg i.up,.sh2 i.dn,.shleg i.dn,.shleg i.edd{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fa15a}.sh2 i.dn,.shleg i.dn{background:#c4623a}.shleg i.edd{background:var(--acc)}
.sh2 b.w,.shleg b.w{color:#c4623a}
.sh2 td.cc{background-image:linear-gradient(color-mix(in srgb,var(--acc) 6%,transparent),color-mix(in srgb,var(--acc) 6%,transparent))}
.sh2 tr.gap td{height:12px;background:var(--card)}
.sh2 tr.sec td{height:48px;font-weight:800;font-size:14px;color:var(--ink)}
.sh2 tr.s-in td{background-color:color-mix(in srgb,#7fa15a 10%,var(--card))}.sh2 tr.s-out td{background-color:color-mix(in srgb,var(--acc) 10%,var(--card))}
.sh2 tr.sec td:first-child,.sh2 tr.sob2 td:first-child{border-radius:14px 0 0 14px}.sh2 tr.sec td:last-child,.sh2 tr.sob2 td:last-child{border-radius:0 14px 14px 0}
.sh2 .sdot{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:10px;vertical-align:0}.s-in .sdot{background:#7fa15a}.s-out .sdot{background:var(--acc)}
.sh2 .add2{font-size:11.5px;font-weight:600;margin-left:8px;opacity:0;transition:opacity .15s}.sh2 tr.sec:hover .add2,.sh2 .add2:focus-visible{opacity:.75}
.sh2 tr.rw td{border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);color:color-mix(in srgb,var(--ink) 88%,transparent)}
.sh2 tr.rw .nm{padding-left:36px;font-weight:500}
.sh2 .ract{opacity:0;margin-left:6px;transition:opacity .15s}.sh2 tr.rw:hover .ract{opacity:1}
.sh2 td.ed{cursor:text;border-radius:10px;transition:background-color .12s}
.sh2 td.ed:hover{background-color:color-mix(in srgb,var(--acc) 10%,var(--card))}
.sh2 td.edt{position:relative;font-weight:600}.sh2 td.edt::before{content:'';position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--acc)}
.sh2 .z{color:color-mix(in srgb,var(--mut) 50%,transparent)}.sh2 .er{color:#c4623a;font-weight:700;font-size:12px}
.sh2 tr.muted td{color:var(--mut);font-size:12.5px;height:34px}
.sh2 tr.sob2 td{height:60px;font-weight:800;font-size:14.5px;background-color:var(--bg);color:var(--ink)}
.sh2 .pill{display:inline-block;padding:5px 11px;border-radius:99px;background:var(--card)}
.sh2 .pill.pos{background:color-mix(in srgb,#7fa15a 18%,var(--card));color:#4d7a2a}.sh2 .pill.neg{background:color-mix(in srgb,#c4623a 16%,var(--card));color:#b0532e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sh2 .pill.pos{color:#a9cf86}:root:not([data-theme="light"]) .sh2 .pill.neg{color:#eb9a78}}
.sh2 .yr{font-weight:700;color:var(--ink)}.sh2 td.yr{border-left:1px solid var(--line)}
.sh2 .rf{font-size:10px;color:var(--mut);background:var(--bg);border-radius:5px;padding:1px 5px;margin-right:6px;font-weight:600;display:inline-block}
.sh2 thead .rf{margin:0 0 2px}
.sh2 td.ing{padding:0;background:var(--card)!important;background-image:none!important;box-shadow:inset 0 0 0 2px var(--acc);border-radius:10px}
.sh2 td.ing::before{display:none}
.sh2 td.ing input{all:unset;box-sizing:border-box;display:block;width:100%;min-width:0;height:38px;padding:0 10px;text-align:right;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);caret-color:var(--acc)}
.shleg{align-items:center}
/* finanças simples */
.fseg2{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--sh)}
.fseg2 button{all:unset;cursor:pointer;padding:8px 20px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mut)}.fseg2 button.on{background:var(--ink);color:var(--bg)}.fseg2 button:focus-visible{outline:2px solid var(--acc)}
.fsum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.fsum>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}.fsum b{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em}.fsum small{color:var(--mut)}
.fsum .pos{background:color-mix(in srgb,#7fa15a 12%,var(--card))}.fsum .neg{background:color-mix(in srgb,#c4623a 12%,var(--card))}.fsum .neg b{color:#b0532e}.fsum .pos b{color:#4d7a2a}
.fqa{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--sh);margin-bottom:16px}
.fqa input,.fqa select{width:auto;flex:1 1 120px;background:var(--bg);border-color:transparent;min-width:0}

 let L=S.chars.filter(c=>(!!F.arch)===c.arch&&(!q||cNames(c).join(' ').toLowerCase().includes(q))&&(!F.sid||c.sid===F.sid)&&(!ui.sid||c.sid===ui.sid)&&(!F.proj||c.proj===F.proj)&&(!F.cat||c.cat===F.cat)&&(!F.tag||c.tags.includes(F.tag))&&(!F.st||c.status===F.st)&&(!F.noimg||!c.cover));
 const so=ui.cso||'upd';L.sort(so==='name'?(a,b)=>a.name.localeCompare(b.name,'pt'):so==='new'?(a,b)=>b.created-a.created:(a,b)=>b.updated-a.updated);
 const U=[...new Set(S.chars.map(c=>c.univ).filter(Boolean))].sort(),T=[...new Set(S.chars.flatMap(c=>c.tags))].sort(),C=[...new Set(S.chars.map(c=>c.cat).filter(Boolean))].sort(),P=S.projects.filter(p=>S.chars.some(c=>c.proj===p.id));
 const sel=(k,lab,opts)=>`<select class='csel' data-cfl='${k}' aria-label='${lab}'><option value=''>${lab}</option>${opts.map(([val,l])=>`<option value='${esc(val)}' ${F[k]===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 const head=ui.sid?`<div class='row sp' style='margin-bottom:12px'><p class='mut' style='margin:0'>Personagens desta história.</p><button class='btn' data-a='chnew'>+ Novo personagem</button></div>`:`<div class='row sp'><div><h1>Todos os personagens</h1><div class='sub'>Personagens de todas as histórias.</div></div><button class='btn' data-a='chnew'>+ Novo personagem</button></div>`;
 if(!S.chars.some(c=>!ui.sid||c.sid===ui.sid))return head+`<div class='cempty'><div class='cempty-art'>${['#f2c94c','#b0629a','#5b8fb9'].map((x,i)=>`<i style='background:${x};--r:${(i-1)*9}deg'></i>`).join('')}</div><h2>Comece o seu primeiro personagem</h2><p class='mut'>Dê um nome e preencha só o que já sabe. Todos os campos são opcionais e salvam sozinhos.</p><button class='btn' data-a='chnew'>+ Novo personagem</button></div>`;
 const bar=`<div class='cbar'><div class='row' style='gap:6px'><button class='chip ${mode==='gal'?'on':''}' data-a='cmode' data-v='gal'>Galeria</button><button class='chip ${mode==='map'?'on':''}' data-a='cmode' data-v='map'>Mapa de relações</button></div>
 <div class='cfilt'><input id='cq' class='csel' placeholder='Buscar por nome' value='${esc(ui.cq||'')}' style='width:190px'>${!ui.sid&&S.stories.length?sel('sid','História',S.stories.map(x=>[x.id,x.title||'Sem título'])):''}${P.length?sel('proj','Projeto',P.map(p=>[p.id,p.name])):''}${C.length?sel('cat','Categoria',C.map(x=>[x,x])):''}${T.length?sel('tag','Tag',T.map(x=>[x,'#'+x])):''}${sel('st','Status',CST)}
 ${mode==='gal'?`<select class='csel' data-cso aria-label='Ordenar'><option value='upd' ${so==='upd'?'selected':''}>Modificados recentemente</option><option value='new' ${so==='new'?'selected':''}>Criados recentemente</option><option value='name' ${so==='name'?'selected':''}>Nome (A–Z)</option></select>
 <label class='ctog'><input type='checkbox' data-cfl='noimg' ${F.noimg?'checked':''}> Sem imagem</label><label class='ctog'><input type='checkbox' data-cfl='arch' ${F.arch?'checked':''}> Arquivados</label>
 <div class='cview' role='group' aria-label='Visualização'>${[['grid','Grade','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],['list','Lista','M4 6h16M4 12h16M4 18h16'],['comp','Compacta','M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4z']].map(([k,l,d])=>`<button class='${v===k?'on':''}' data-a='cv' data-v='${k}' title='${l}' aria-label='${l}'><svg viewBox='0 0 24 24'><path d='${d}'/></svg></button>`).join('')}</div>`:''}</div></div>`;
 if(mode==='map'){const ids=new Set(L.filter(c=>!c.arch).map(c=>c.id)),R=S.crel.filter(r=>ids.has(r.a)&&ids.has(r.b));
  return head+bar+(R.length?`<div class='cmapw'>${cMap(L.filter(c=>c.arch===false&&R.some(r=>r.a===c.id||r.b===c.id)),R,null)}<div class='cleg'>${CREL.filter(t=>R.some(r=>r.type===t[0])).map(t=>`<span><i style='background:${t[2]}'></i>${t[1]}</span>`).join('')}<span class='mut'>Arraste para organizar. Clique para abrir a ficha.</span></div></div>`:`<div class='empty' style='margin-top:16px'>Ainda não há relações entre os personagens filtrados. Abra uma ficha e use a aba Relações para conectar personagens.</div>`)}
 const st=c=>`<span class='cst st-${c.status}'>${cStL(c.status)}</span>`,meta=c=>[c.univ,cProj(c.proj),c.cat].filter(Boolean).map(esc).join(' / ');
 const body=!L.length?`<div class='empty' style='margin-top:16px'>Nenhum personagem com esses filtros.</div>`:
  v==='list'?`<div class='clist'>${L.map(c=>`<div class='crow' data-a='copen' data-id='${c.id}' tabindex='0' role='button'>${cAv(c,'sm')}<div class='crn'><b>${esc(c.name||'Sem nome')}</b><small>${esc(c.short||'').slice(0,90)}</small></div><span class='mut'>${meta(c)||'—'}</span><span class='ctags'>${c.tags.slice(0,3).map(t=>`<i>#${esc(t)}</i>`).join('')}</span>${st(c)}<small class='mut'>${new Date(c.updated).toLocaleDateString('pt-BR')}</small></div>`).join('')}</div>`:
  v==='comp'?`<div class='ccomp'>${L.map(c=>`<div class='ccmp' data-a='copen' data-id='${c.id}' tabindex='0' role='button'>${cAv(c)}<b>${esc(c.name||'Sem nome')}</b></div>`).join('')}</div>`:
  `<div class='cgrid'>${L.map(c=>`<article class='ccard' data-a='copen' data-id='${c.id}' tabindex='0' role='button'><div class='ccov'>${cAv(c)}${st(c)}</div><div class='cbody'><h3>${esc(c.name||'Sem nome')}</h3>${meta(c)?`<div class='cmeta'>${meta(c)}</div>`:''}${c.short?`<p>${esc(c.short)}</p>`:''}${c.tags.length?`<div class='ctags'>${c.tags.slice(0,4).map(t=>`<i>#${esc(t)}</i>`).join('')}</div>`:''}</div></article>`).join('')}</div>`;
 return head+bar+body}

/* ---------- ficha do personagem ---------- */
function charPg(c){const vis=CTABS.filter(([k])=>k==='ov'||!c.hide.includes(k)).concat(c.xsec.filter(s=>!c.hide.includes(s.id)).map(s=>[s.id,s.title||'Seção'])),tab=vis.some(t=>t[0]===ui.ctab)?ui.ctab:'ov';ui.ctab=tab;
 const U=[...new Set(S.chars.map(x=>x.univ).filter(Boolean))],C=[...new Set([...CCAT,...S.chars.map(x=>x.cat).filter(Boolean)])];
 const fact=(k,l)=>c.f[k]?`<div><small>${l}</small><b>${esc(c.f[k])}</b></div>`:'',facts=[['age','Idade'],['pron','Pronomes'],['species','Espécie'],['origin','Origem'],['job','Ocupação']].map(([k,l])=>fact(k,l)).join('');
 const hero=`${c.arch?`<div class='carch'>Este personagem está arquivado. <button class='ib' data-a='carch'>Desarquivar</button></div>`:''}<div class='chero' style='--h:${c.hue}'><div class='chbg'>${c.cover?`<img data-f='${esc(c.cover)}' alt=''>`:''}</div>
 <div class='chin'><div class='chpor'>${cAv(c,'big')}<div class='chpb'><button class='ib' data-a='ccov'>${c.cover?'Trocar imagem principal':'+ Imagem principal'}</button>${c.cover?`<button class='ib' data-a='ccovx'>Remover</button>`:''}</div>${c.cover?`<label class='cpos'><small>Enquadramento</small><input type='range' min='0' max='100' value='${c.cpos}' data-ct='cpos'></label>`:''}</div>
 <div class='chtx'><div class='row sp' style='margin-bottom:6px'><span class='crumb'><button class='ib' data-a='stroot'>‹ Histórias</button>${ui.sid&&sCur()?`<i>/</i><button class='ib' data-a='cback'>${esc(sCur().title||'História')}</button>`:ui.sall?`<i>/</i><button class='ib' data-a='cback'>Todos os personagens</button>`:''}</span><span class='row' style='gap:2px'><button class='ib' data-a='carch'>${c.arch?'Desarquivar':'Arquivar'}</button><button class='ib' data-a='cdel'>🗑 Excluir</button></span></div>
 <input class='chname' data-ct='name' value='${esc(c.name)}' placeholder='Nome do personagem' aria-label='Nome'><textarea class='chshort cauto' data-ct='short' rows='1' placeholder='Uma frase que resume quem é este personagem'>${esc(c.short)}</textarea>
 <div class='chmeta'><label><small>História</small><select data-ct='sid'><option value=''>Sem história</option>${S.stories.map(x=>`<option value='${x.id}' ${x.id===c.sid?'selected':''}>${esc(x.title||'Sem título')}</option>`).join('')}</select></label><datalist id='cul'>${U.map(x=>`<option value='${esc(x)}'>`).join('')}</datalist>
 <label><small>Projeto</small><select data-ct='proj'><option value=''>—</option>${S.projects.filter(p=>!p.arch||p.id===c.proj).map(p=>`<option value='${p.id}' ${p.id===c.proj?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
 <label><small>Categoria</small><input data-ct='cat' list='ccl' value='${esc(c.cat)}' placeholder='—'></label><datalist id='ccl'>${C.map(x=>`<option value='${esc(x)}'>`).join('')}</datalist>
 <label><small>Status</small><select data-ct='status'>${CST.map(([k,l])=>`<option value='${k}' ${c.status===k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class='wide'><small>Tags (separadas por vírgula)</small><input data-ct='tags' value='${esc(c.tags.join(', '))}' placeholder='ex.: mago, família real'></label></div>
 ${facts?`<div class='chfacts'>${facts}</div>`:''}</div></div></div>`;
 const tabs=`<nav class='ctabs' aria-label='Seções da ficha'>${vis.map(([k,l])=>`<button class='${k===tab?'on':''}' data-a='ctab' data-t='${k}'>${esc(l)}</button>`).join('')}<button class='cfgb' data-a='ccfg' title='Escolher seções e criar campos'>⚙ Personalizar ficha</button></nav>`;
 const xs=c.xsec.find(s=>s.id===tab);
 const content=tab==='ov'?cOv(c):CSEC[tab]?cSec(c,tab)+(tab==='voice'?cVoice(c):tab==='psy'?cArc(c):''):tab==='story'?cStory(c):tab==='skills'?cSkills(c):tab==='gal'?cGalT(c):tab==='ref'?cRefT(c):tab==='rel'?cRelT(c):tab==='app'?cApp(c):xs?cXs(c,xs):'';
 return hero+tabs+`<div class='cpane'>${content}</div>`}

const cIn=(l,id,p,val,ph='',ta)=>ta?`<textarea class='cauto' rows='1' data-cx='${l}|${id}|${p}' placeholder='${esc(ph)}'>${esc(val||'')}</textarea>`:`<input data-cx='${l}|${id}|${p}' value='${esc(val||'')}' placeholder='${esc(ph)}'>`;
function cXf(c,l,title){const L=cList(c,l);return`<details class='cgrp' ${L.length?'open':''}><summary>${title||'Campos personalizados'} <small>${L.length?L.length+' campo'+(L.length>1?'s':''):'crie os seus'}</small></summary><div class='cfg'>${L.map(f=>`<div class='cfl l cxf'><div class='row sp'>${cIn(l,f.id,'label',f.label,'Nome do campo')}<button class='ib' data-a='cdi' data-l='${l}' data-id='${f.id}' title='Remover campo'>✕</button></div>${cIn(l,f.id,'val',f.val,'Escreva aqui…',1)}</div>`).join('')}<button class='cadd' data-a='cxf' data-l='${l}'>+ Campo personalizado</button></div></details>`}
function cSec(c,sec){const S_=CSEC[sec];return S_.g.map(([gt,F])=>{const n=F.filter(f=>String(c.f[f[0]]||'').trim()).length;return`<details class='cgrp' open><summary>${gt} <small>${n} de ${F.length}</small></summary><div class='cfg'>${F.map(([k,l,s])=>`<label class='cfl ${s||''}'><span>${l}</span>${s?`<textarea class='cauto' rows='${s==='xl'?3:2}' data-cf='${k}'>${esc(c.f[k]||'')}</textarea>`:`<input data-cf='${k}' value='${esc(c.f[k]||'')}'>`}</label>`).join('')}</div></details>`}).join('')+cXf(c,'xf:'+sec)}
function cOv(c){const secs=['id','look','pers','psy','voice'].filter(k=>!c.hide.includes(k)),G=cGal(c),R=cRels(c),st=[...CSTORY,...c.ssec.map(s=>[s.id,s.title])].filter(([k])=>nText(c.story[k]||'').trim()).length;
 const kv=[['full','Nome completo','id'],['role','Papel na história','id'],['traits','Características principais','pers'],['goal','Objetivo principal','psy'],['intc','Conflito interno','psy'],['marks','Características marcantes','look']].filter(([k])=>String(c.f[k]||'').trim());
 return`<div class='cov'><div class='covm'>
 ${c.f.phrases?`<blockquote class='cquote'>${esc(String(c.f.phrases).split('\n')[0])}</blockquote>`:''}
 ${kv.length?`<div class='ckv'>${kv.map(([k,l,s])=>`<div data-a='ctab' data-t='${s}'><small>${l}</small><p>${esc(c.f[k])}</p></div>`).join('')}</div>`:`<div class='empty'>A ficha ainda está em branco. Comece por <button class='ib' data-a='ctab' data-t='id'>Identidade</button> ou <button class='ib' data-a='ctab' data-t='pers'>Personalidade</button>, preenchendo só o que já sabe.</div>`}
 ${G.length?`<h2 style='margin-top:22px'>Galeria <button class='ib' data-a='ctab' data-t='gal'>ver tudo (${G.length})</button></h2><div class='cstrip'>${G.slice(0,8).map(g=>`<button data-a='cgo' data-id='${g.id}'><img data-f='${esc(g.f)}' alt='${esc(g.desc)}'></button>`).join('')}</div>`:''}
 ${c.timeline.length?`<h2 style='margin-top:22px'>Linha do tempo <button class='ib' data-a='ctab' data-t='story'>abrir</button></h2><div class='ctl mini'>${c.timeline.slice(0,5).map(t=>`<div class='ctli'><i></i><small>${esc(t.when||'')}</small><b>${esc(t.title||'Sem título')}</b></div>`).join('')}</div>`:''}
 </div><div class='covs'>${cMainCard(c)}<h2>Progresso da ficha</h2>${secs.map(k=>{const[n,t]=cFilled(c,k);return`<div class='cprog' data-a='ctab' data-t='${k}'><div class='row sp'><span>${CSEC[k].t}</span><small>${n}/${t}</small></div><div class='bar'><i style='width:${n/t*100}%'></i></div></div>`}).join('')}
 <div class='cnums'><div data-a='ctab' data-t='story'><b>${st}</b><small>trechos da história</small></div><div data-a='ctab' data-t='gal'><b>${G.length}</b><small>imagens</small></div><div data-a='ctab' data-t='rel'><b>${R.length}</b><small>relações</small></div><div data-a='ctab' data-t='skills'><b>${c.skills.length}</b><small>habilidades</small></div></div>
 ${R.length?`<h2 style='margin-top:18px'>Relações</h2>${R.slice(0,6).map(r=>{const o=cOther(r,c),t=cRT(r.type);return`<div class='crl' data-a='copen' data-id='${o.id}'>${cAv(o,'xs')}<span><b>${esc(o.name||'Sem nome')}</b><small style='color:${t[2]}'>${t[1]}</small></span></div>`}).join('')}`:''}
 <small class='mut' style='display:block;margin-top:16px'>Criado em ${new Date(c.created).toLocaleDateString('pt-BR')} · modificado em ${new Date(c.updated).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</small></div></div>`}
const cTb=k=>`<div class='tb crtb'>${[['bold','<b>B</b>'],['italic','<i>I</i>'],['underline','<u>U</u>'],['h','Título'],['ul','• Lista'],['q','Citação'],['note','📌 Nota'],['link','🔗 Link'],['img','🖼 Imagem']].map(([a,l])=>`<button class='ib' data-rt='${a}' data-k='${k}'>${l}</button>`).join('')}</div>`;
function cStory(c){const S2=[...CSTORY.map(([k,l])=>({k,l})),...c.ssec.map(s=>({k:s.id,l:s.title,cu:1}))];
 return`<div class='cstory'><nav class='csnav'><b>Seções</b>${S2.map(s=>`<a href='#cs-${s.k}' class='${nText(c.story[s.k]||'').trim()||String(c.story[s.k]||'').includes('<img')?'on':''}'>${esc(s.l||'Seção')}</a>`).join('')}<a href='#cs-tl'>Linha do tempo</a><button class='cadd' data-a='cadd' data-l='ssec'>+ Seção da história</button></nav><div class='csbody'>
 ${S2.map(s=>`<section class='cssec' id='cs-${s.k}'><div class='row sp'>${s.cu?`<input class='csh' data-cx='ssec|${s.k}|title' value='${esc(s.l)}'><button class='ib' data-a='cdi' data-l='ssec' data-id='${s.k}' title='Remover seção'>✕</button>`:`<h3>${s.l}</h3>`}</div>${cTb(s.k)}<div class='crt' contenteditable='true' spellcheck='true' data-crt='${s.k}' data-ph='Escreva sobre ${esc(String(s.l).toLowerCase())}…'>${nSan(c.story[s.k]||'')}</div></section>`).join('')}
 <section class='cssec' id='cs-tl'><div class='row sp'><h3>Linha do tempo</h3><button class='btn g' data-a='cadd' data-l='timeline'>+ Acontecimento</button></div>${c.timeline.length?`<div class='ctl'>${c.timeline.map((t,i)=>`<div class='ctli'><i></i><div class='ctlf'><div class='row' style='gap:8px'>${cIn('timeline',t.id,'when',t.when,'Quando (ex.: 12 anos, 1998)')}<span class='cmv'><button class='ib' data-a='cmv' data-l='timeline' data-id='${t.id}' data-v='-1' ${i?'':'disabled'} title='Subir'>↑</button><button class='ib' data-a='cmv' data-l='timeline' data-id='${t.id}' data-v='1' ${i<c.timeline.length-1?'':'disabled'} title='Descer'>↓</button><button class='ib' data-a='cdi' data-l='timeline' data-id='${t.id}' title='Remover'>✕</button></span></div>${cIn('timeline',t.id,'title',t.title,'O que aconteceu')}${cIn('timeline',t.id,'desc',t.desc,'Detalhes e consequências',1)}</div></div>`).join('')}</div>`:`<div class='empty'>Marque os acontecimentos que mudaram a vida do personagem.</div>`}</section></div></div>`}
function cArc(c){return`<details class='cgrp' open><summary>Evolução ao longo da história <small>por capítulo ou episódio</small></summary><div class='carc'>${c.arc.map((a,i)=>`<div class='carcc'><div class='row sp'><span class='carcn'>${i+1}</span><span class='cmv'><button class='ib' data-a='cmv' data-l='arc' data-id='${a.id}' data-v='-1' ${i?'':'disabled'}>‹</button><button class='ib' data-a='cmv' data-l='arc' data-id='${a.id}' data-v='1' ${i<c.arc.length-1?'':'disabled'}>›</button><button class='ib' data-a='cdi' data-l='arc' data-id='${a.id}'>✕</button></span></div>${cIn('arc',a.id,'ch',a.ch,'Capítulo ou episódio')}${cIn('arc',a.id,'state',a.state,'Como está neste ponto',1)}${cIn('arc',a.id,'change',a.change,'O que mudou',1)}</div>`).join('')}<button class='cadd carcc' data-a='cadd' data-l='arc'>+ Ponto do arco</button></div></details>`}
function cSkills(c){const by=CSKT.map(t=>[t,c.skills.filter(s=>(s.type||'Habilidade')===t)]).filter(x=>x[1].length);
